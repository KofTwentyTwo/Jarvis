name: Jarvis
options:
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: 7UC2HETAN9
    OTHER_CODE_SIGN_FLAGS: "--options=runtime --timestamp"
    LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  Keychain:
    path: packages/Keychain
  Config:
    path: packages/Config
  Logging:
    path: packages/Logging
  Shell:
    path: packages/Shell
targets:
  Jarvis:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Jarvis.entitlements"
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koftwentytwo.jarvis
        PRODUCT_NAME: Jarvis
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Jarvis.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: 7UC2HETAN9
        OTHER_CODE_SIGN_FLAGS: "--options=runtime --timestamp"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: Keychain
        product: Keychain
      - package: Config
        product: Config
      - package: Logging
        product: JarvisLogging
      - package: Shell
        product: Shell
    copyFiles:
      - destination: wrapper
        subpath: Contents/Helpers
        files: []
    postBuildScripts:
      - name: Create Contents/Helpers directory
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Helpers"
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
      - name: Verify entitlements (pre-codesign)
        script: |
          "${SRCROOT}/scripts/verify-entitlements.sh" --pre-codesign
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
      - name: Codesign bundle (deepest-first)
        script: |
          # Fall back to CODE_SIGN_IDENTITY (then ad-hoc "-") when CODE_SIGNING_ALLOWED=NO,
          # since Xcode does not set EXPANDED_CODE_SIGN_IDENTITY in that case.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          "${SRCROOT}/scripts/codesign.sh"
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
      - name: Verify entitlements (post-codesign)
        script: |
          "${SRCROOT}/scripts/verify-entitlements.sh" --post-codesign
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
      - name: Verify codesign settings (pbxproj lint)
        script: |
          "${SRCROOT}/scripts/verify-codesign-settings.sh"
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
  JarvisAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/AppTests
    settings:
      base:
        PRODUCT_NAME: JarvisAppTests
        PRODUCT_BUNDLE_IDENTIFIER: com.koftwentytwo.jarvis.AppTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jarvis.app/Contents/MacOS/Jarvis"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: Jarvis
  JarvisEntitlementProbeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/JarvisEntitlementProbeTests
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: JarvisEntitlementProbeTests
        PRODUCT_BUNDLE_IDENTIFIER: com.koftwentytwo.jarvis.EntitlementProbeTests
        INFOPLIST_FILE: App/Tests/JarvisEntitlementProbeTests/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jarvis.app/Contents/MacOS/Jarvis"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        OTHER_SWIFT_FLAGS: "-DJARVIS_ENTITLEMENT_PROBE"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: Jarvis
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisAppTests: [test]
    test:
      targets:
        - JarvisAppTests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  EntitlementProbe:
    build:
      targets:
        Jarvis: all
        JarvisEntitlementProbeTests: [test]
    test:
      targets:
        - JarvisEntitlementProbeTests
      gatherCoverageData: false
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
